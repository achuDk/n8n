openapi: 3.0.0
info:
  title: decorator-routes
  version: 0.0.0
paths:
  /git-connections:
    post:
      $ref: ./handlers/git-connections/spec/paths/create.generated.yml
    get:
      $ref: ./handlers/git-connections/spec/paths/list.generated.yml
  /git-connections/{id}:
    get:
      $ref: ./handlers/git-connections/spec/paths/get.generated.yml
    put:
      $ref: ./handlers/git-connections/spec/paths/update.generated.yml
    delete:
      $ref: ./handlers/git-connections/spec/paths/delete.generated.yml
  /git-connections/{id}/connect:
    post:
      $ref: ./handlers/git-connections/spec/paths/connect.generated.yml
  /git-connections/{id}/disconnect:
    post:
      $ref: ./handlers/git-connections/spec/paths/disconnect.generated.yml
  /role-mapping-rules:
    post:
      $ref: ./handlers/role-mapping-rules/spec/paths/createRoleMappingRule.generated.yml
  /roles:
    get:
      $ref: ./handlers/roles/spec/paths/getAllRoles.generated.yml
    post:
      $ref: ./handlers/roles/spec/paths/createRole.generated.yml
  /tags:
    get:
      $ref: ./handlers/tags/spec/paths/getTags.generated.yml
  /workflows:
    get:
      $ref: ./handlers/workflows/spec/paths/getWorkflows.generated.yml
  /workflows/{workflowId}:
    get:
      $ref: ./handlers/workflows/spec/paths/getWorkflow.generated.yml
  /workflows/{workflowId}/history:
    get:
      $ref: ./handlers/workflows/spec/paths/getWorkflowHistory.generated.yml
  /workflows/{workflowId}/tags:
    get:
      $ref: ./handlers/workflows/spec/paths/getWorkflowTags.generated.yml
    put:
      $ref: ./handlers/workflows/spec/paths/updateWorkflowTags.generated.yml
